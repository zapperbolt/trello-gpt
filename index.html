<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrelloGPT</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f3f5f9;
      color: #172033;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      width: min(760px, 100%);
      height: min(780px, calc(100vh - 48px));
      min-height: 500px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: white;
      border: 1px solid #e4e8f0;
      border-radius: 20px;
      box-shadow: 0 20px 60px #25345a18;
    }

    header {
      padding: 22px 26px;
      border-bottom: 1px solid #edf0f5;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #e9edff;
      font-size: 23px;
    }

    h1 { margin: 0; font-size: 20px; }
    .subtitle { margin-top: 4px; color: #748096; font-size: 13px; }

    .status {
      margin-left: auto;
      color: #337b55;
      background: #eaf7ef;
      border-radius: 20px;
      padding: 7px 11px;
      font-size: 12px;
      white-space: nowrap;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 26px;
    }

    .welcome { max-width: 520px; margin: 12px auto; text-align: center; }
    .welcome h2 { margin-bottom: 8px; font-size: 24px; }
    .welcome p { color: #748096; line-height: 1.5; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
    }

    .suggestions button {
      padding: 10px 13px;
      border: 1px solid #e2e7f0;
      border-radius: 18px;
      color: #394660;
      background: white;
      cursor: pointer;
    }

    .suggestions button:hover { background: #f5f7ff; border-color: #bdc8ff; }

    .message {
      width: fit-content;
      max-width: 82%;
      margin: 12px 0;
      padding: 12px 15px;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user { margin-left: auto; color: white; background: #5368df; border-bottom-right-radius: 5px; }
    .assistant { margin-right: auto; color: #263149; background: #f0f2f7; border-bottom-left-radius: 5px; }
    .error { color: #9f3030; background: #fff0f0; }

    form {
      display: flex;
      gap: 10px;
      padding: 18px 22px;
      border-top: 1px solid #edf0f5;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px 16px;
      border: 1px solid #dfe4ed;
      border-radius: 14px;
      outline: none;
      font: inherit;
    }

    input:focus { border-color: #7384ef; box-shadow: 0 0 0 3px #7384ef20; }

    form button {
      padding: 0 20px;
      border: 0;
      border-radius: 14px;
      color: white;
      background: #5368df;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    form button:disabled { opacity: .55; cursor: wait; }

    @media (max-width: 560px) {
      body { padding: 0; }
      .app { height: 100vh; min-height: 0; border: 0; border-radius: 0; }
      header { padding: 18px; }
      #messages { padding: 18px; }
      .status { font-size: 11px; }
      form { padding: 14px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="logo" aria-hidden="true">📋</div>
      <div>
        <h1>TrelloGPT</h1>
        <div class="subtitle">Your Trello tasks, with a little help from AI</div>
      </div>
      <div class="status">● Local Qwen</div>
    </header>

    <section id="messages" aria-live="polite">
      <div class="welcome" id="welcome">
        <h2>What would you like to work on?</h2>
        <p>Ask a question about the cards on your Trello board.</p>
        <div class="suggestions">
          <button type="button">What should I focus on?</button>
          <button type="button">Summarise my tasks</button>
          <button type="button">Which tasks have due dates?</button>
        </div>
      </div>
    </section>

    <form id="chat-form">
      <input id="question" autocomplete="off" placeholder="Ask about your Trello tasks…" required>
      <button id="send" type="submit">Send</button>
    </form>
  </main>

  <script>
    const form = document.querySelector("#chat-form");
    const input = document.querySelector("#question");
    const send = document.querySelector("#send");
    const messages = document.querySelector("#messages");
    const welcome = document.querySelector("#welcome");

    function addMessage(text, type) {
      const bubble = document.createElement("div");
      bubble.className = `message ${type}`;
      bubble.textContent = text;
      messages.appendChild(bubble);
      messages.scrollTop = messages.scrollHeight;
      return bubble;
    }

    document.querySelectorAll(".suggestions button").forEach(button => {
      button.addEventListener("click", () => {
        input.value = button.textContent;
        input.focus();
      });
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      welcome.hidden = true;
      addMessage(question, "user");
      input.value = "";
      input.disabled = true;
      send.disabled = true;
      send.textContent = "Thinking…";
      const waiting = addMessage("Qwen is thinking…", "assistant");

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "The server returned an error.");

        waiting.textContent = data.answer || "I didn’t get a response.";
      } catch (error) {
        waiting.className = "message error";
        waiting.textContent = `Couldn’t get a reply: ${error.message}`;
      } finally {
        input.disabled = false;
        send.disabled = false;
        send.textContent = "Send";
        input.focus();
      }
    });
  </script>
</body>
</html>
